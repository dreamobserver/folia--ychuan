name: build-folia-apk

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          SDK="$ANDROID_HOME"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then SDK=/usr/local/lib/android/sdk; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          CMDLINE=$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | head -1)
          echo "sdk=$SDK cmdline=$CMDLINE"
          yes | "$CMDLINE/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo 'missing KEYSTORE_BASE64' >&2; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > android.keystore
          ls -la android.keystore

      - name: Build release APK
        env:
          KEYSTORE_PATH: ../android.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: folia
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Show output
        run: |
          find app/build/outputs -name '*.apk' -exec ls -la {} \;
          keytool -printcert -jarfile $(find app/build/outputs -name '*.apk' | head -1) | grep -i 'SHA256' || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: folia-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
