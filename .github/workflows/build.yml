name: build-folia-twa

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install Bubblewrap
        run: |
          npm i -g @bubblewrap/cli
          bubblewrap --version

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo 'missing secret KEYSTORE_BASE64' >&2; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android.keystore
          ls -la android.keystore

      - name: Build TWA
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bubblewrap build --skipPwaValidation

      - name: Show signing fingerprint
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          keytool -list -v -keystore android.keystore -storepass "$KEYSTORE_PASSWORD" | grep -i 'SHA256:' || true
          ls -la *.apk *.aab assetlinks.json 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: folia-twa
          path: |
            *.apk
            *.aab
            assetlinks.json
          if-no-files-found: warn
